<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Build Log — 6 Month Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --ink: #1B2430;
  --card: #232E3D;
  --card-hi: #2B3A4C;
  --amber: #E8A33D;
  --amber-dim: #6B5530;
  --coral: #E8756A;
  --sage: #86B08A;
  --text: #F2EDE4;
  --text-dim: #9AA5B3;
  --line: #34445A;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font-family: 'Work Sans', sans-serif;
  min-height: 100vh;
  padding: 32px 20px 80px;
}

.wrap { max-width: 780px; margin: 0 auto; }

h1 {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 2rem;
  margin: 0 0 4px;
  letter-spacing: -0.01em;
}

.sub { color: var(--text-dim); font-size: 0.92rem; margin-bottom: 28px; }

/* Streak hero */
.hero {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
}

.hero-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}

.streak-num {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 2.6rem;
  font-weight: 600;
  color: var(--amber);
  line-height: 1;
}

.streak-label { color: var(--text-dim); font-size: 0.82rem; margin-top: 4px; }

.best-streak {
  text-align: right;
  font-family: 'IBM Plex Mono', monospace;
  color: var(--text-dim);
  font-size: 0.85rem;
}

.best-streak b { color: var(--sage); font-size: 1.1rem; }

.checkin-btn {
  background: var(--amber);
  color: var(--ink);
  border: none;
  border-radius: 10px;
  padding: 12px 20px;
  font-family: 'Work Sans', sans-serif;
  font-weight: 600;
  font-size: 0.95rem;
  cursor: pointer;
  transition: transform 0.1s ease, background 0.15s ease;
}
.checkin-btn:hover { background: #f0b559; }
.checkin-btn:active { transform: scale(0.97); }
.checkin-btn.done {
  background: var(--card-hi);
  color: var(--sage);
  border: 1px solid var(--sage);
  cursor: default;
}

/* Lantern strand */
.strand {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding-top: 16px;
  border-top: 1px dashed var(--line);
}

.lantern {
  width: 16px;
  height: 20px;
  border-radius: 4px 4px 8px 8px;
  background: var(--card-hi);
  border: 1.5px solid var(--line);
  position: relative;
  flex-shrink: 0;
}

.lantern::before {
  content: '';
  position: absolute;
  top: -5px;
  left: 50%;
  transform: translateX(-50%);
  width: 1.5px;
  height: 5px;
  background: var(--line);
}

.lantern.lit {
  background: var(--amber);
  border-color: var(--amber);
  box-shadow: 0 0 8px rgba(232, 163, 61, 0.6);
}
.lantern.lit::before { background: var(--amber-dim); }

.strand-caption {
  width: 100%;
  font-size: 0.72rem;
  color: var(--text-dim);
  margin-top: 8px;
  font-family: 'IBM Plex Mono', monospace;
}

/* Overall progress */
.overall {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}
.overall-bar-track {
  flex: 1;
  height: 10px;
  background: var(--card-hi);
  border-radius: 6px;
  overflow: hidden;
}
.overall-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--coral), var(--amber));
  border-radius: 6px;
  transition: width 0.4s ease;
}
.overall-pct {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.85rem;
  color: var(--amber);
  min-width: 42px;
  text-align: right;
}

/* Month tabs */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  margin-bottom: 16px;
  padding-bottom: 4px;
}
.tab {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.8rem;
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 7px 14px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}
.tab.active { background: var(--amber); color: var(--ink); border-color: var(--amber); font-weight: 600; }

.month-progress { font-size: 0.78rem; color: var(--text-dim); margin-bottom: 16px; font-family: 'IBM Plex Mono', monospace; }

/* Week cards */
.week {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 12px;
  overflow: hidden;
}
.week-head {
  padding: 14px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}
.week-title { font-weight: 600; font-size: 0.95rem; }
.week-dates { color: var(--text-dim); font-size: 0.78rem; font-family: 'IBM Plex Mono', monospace; }
.week-badge {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.75rem;
  color: var(--sage);
  background: rgba(134,176,138,0.12);
  padding: 3px 9px;
  border-radius: 10px;
}
.week-body { padding: 0 18px 16px; display: none; }
.week-body.open { display: block; }

.task {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 0;
  border-top: 1px solid var(--line);
  cursor: pointer;
}
.task:first-child { border-top: none; }
.check {
  width: 18px;
  height: 18px;
  border-radius: 5px;
  border: 1.5px solid var(--text-dim);
  flex-shrink: 0;
  margin-top: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}
.task.done .check { background: var(--sage); border-color: var(--sage); color: var(--ink); }
.task.done .task-text { color: var(--text-dim); text-decoration: line-through; }
.task-text { font-size: 0.9rem; line-height: 1.4; }

.reset-link {
  text-align: center;
  margin-top: 28px;
  color: var(--text-dim);
  font-size: 0.78rem;
  font-family: 'IBM Plex Mono', monospace;
  cursor: pointer;
  text-decoration: underline;
}

.loading { text-align: center; color: var(--text-dim); padding: 40px; font-family: 'IBM Plex Mono', monospace; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Build Log</h1>
  <div class="sub">6-month backend + AI engineering plan — check it, don't skip it.</div>

  <div class="hero">
    <div class="hero-top">
      <div>
        <div class="streak-num" id="streakNum">–</div>
        <div class="streak-label">day streak</div>
      </div>
      <div class="best-streak">Longest streak<br><b id="bestStreak">–</b></div>
      <button class="checkin-btn" id="checkinBtn">Mark today done</button>
    </div>
    <div class="strand" id="strand"></div>
    <div class="strand-caption">last 30 days</div>
  </div>

  <div class="overall">
    <div class="overall-bar-track"><div class="overall-bar-fill" id="overallFill" style="width:0%"></div></div>
    <div class="overall-pct" id="overallPct">0%</div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="month-progress" id="monthProgress"></div>
  <div id="weeksContainer" class="loading">Loading your plan…</div>

  <div class="reset-link" id="resetLink">reset all progress</div>
</div>

<script>
const PLAN = [
  { m: 1, label: "Month 1", range: "Aug 24 – Sep 20", weeks: [
    { w: 1, dates: "Aug 24–30", tasks: [
      "NeetCode 150 (Python): Arrays & Hashing — 9 problems (cumulative 9/150)",
      "System Design Primer: read 'Scalability' intro + Performance vs Scalability + Latency vs Throughput",
      "Write why DeepEcom used Effect-TS over async/await" ]},
    { w: 2, dates: "Aug 31–Sep 6", tasks: [
      "NeetCode 150 (Python): Two Pointers — 5 problems (cumulative 14/150)",
      "System Design Primer: CAP theorem (Availability vs Consistency) + Consistency Patterns",
      "Write why XState was used over boolean flags" ]},
    { w: 3, dates: "Sep 7–13", tasks: [
      "NeetCode 150 (Python): Sliding Window — 6 problems (cumulative 20/150)",
      "System Design Primer: Availability Patterns (fail-over, replication)",
      "Write the N+1 bug fix as a STAR story" ]},
    { w: 4, dates: "Sep 14–20", tasks: [
      "NeetCode 150 (Python): Stack — 7 problems (cumulative 27/150)",
      "System Design Primer: DNS + CDN",
      "Write the embedding-model debugging story",
      "Milestone: explain all 3 stories out loud, under 2 min each" ]},
  ]},
  { m: 2, label: "Month 2", range: "Sep 21 – Oct 18", weeks: [
    { w: 5, dates: "Sep 21–27", tasks: [
      "NeetCode 150 (Python): Binary Search — 7 problems (cumulative 34/150)",
      "System Design Primer: Load Balancer + Reverse Proxy" ]},
    { w: 6, dates: "Sep 28–Oct 4", tasks: [
      "NeetCode 150 (Python): Linked List — 11 problems (cumulative 45/150)",
      "System Design Primer: Application Layer (microservices, service discovery)" ]},
    { w: 7, dates: "Oct 5–11", tasks: [
      "NeetCode 150 (Python): Trees, part 1 — 8 problems (cumulative 53/150)",
      "System Design Primer: Database — RDBMS (master-slave, sharding, federation, denormalization)" ]},
    { w: 8, dates: "Oct 12–18", tasks: [
      "NeetCode 150 (Python): Trees part 2 (7) + Tries (3) — 10 problems (cumulative 63/150)",
      "System Design Primer: Database — NoSQL (key-value, document, wide-column, graph)",
      "Milestone: public LeetCode profile shows 60+ solved, all in Python" ]},
  ]},
  { m: 3, label: "Month 3", range: "Oct 19 – Nov 15", weeks: [
    { w: 9, dates: "Oct 19–25", tasks: [
      "Udemy AI Engineer course: finish next chunk — cumulative 63% complete",
      "NeetCode 150 (Python): Heap / Priority Queue — 7 problems (cumulative 70/150)",
      "System Design Primer: Cache (client, CDN, server, DB caching + cache-aside/write-through)" ]},
    { w: 10, dates: "Oct 26–Nov 1", tasks: [
      "Udemy AI Engineer course: cumulative 75% complete",
      "NeetCode 150 (Python): Backtracking — 9 problems (cumulative 79/150)",
      "System Design Primer: Asynchronism (message queues, task queues, back pressure)" ]},
    { w: 11, dates: "Nov 2–8", tasks: [
      "Udemy AI Engineer course: cumulative 88% complete",
      "NeetCode 150 (Python): Graphs, part 1 — 7 problems (cumulative 86/150)",
      "System Design Primer: Communication (TCP/UDP, RPC, REST)" ]},
    { w: 12, dates: "Nov 9–15", tasks: [
      "Udemy AI Engineer course: 100% complete — done",
      "NeetCode 150 (Python): Graphs, part 2 — 6 problems (cumulative 92/150)",
      "System Design Primer: Security + Appendix (latency numbers every programmer should know)",
      "Scope and start portfolio project (narrow RAG or agentic tool — pick ONE, keep it small)" ]},
  ]},
  { m: 4, label: "Month 4", range: "Nov 16 – Dec 13", weeks: [
    { w: 13, dates: "Nov 16–22", tasks: [
      "NeetCode 150 (Python): Advanced Graphs — 6 problems (cumulative 98/150)",
      "System Design Primer case study: Design Pastebin.com",
      "Build core retrieval/agent logic for portfolio project" ]},
    { w: 14, dates: "Nov 23–29", tasks: [
      "NeetCode 150 (Python): 1-D Dynamic Programming, part 1 — 7 problems (cumulative 105/150)",
      "System Design Primer case study: Design the Twitter timeline + search",
      "Finish + polish portfolio project, write a real design-decision README" ]},
    { w: 15, dates: "Nov 30–Dec 6", tasks: [
      "NeetCode 150 (Python): 1-D DP, part 2 — 5 problems (cumulative 110/150)",
      "System Design Primer case study: Design a web crawler + Design Mint.com",
      "Push portfolio project to GitHub with clean commit history; rebuild resume — SDE version" ]},
    { w: 16, dates: "Dec 7–13", tasks: [
      "NeetCode 150 (Python): 2-D Dynamic Programming — 11 problems (cumulative 121/150)",
      "System Design Primer case study: Design a key-value store + a picture-sharing system",
      "Rebuild resume — AI Engineer version",
      "Milestone: portfolio project genuinely finished, not 80%" ]},
  ]},
  { m: 5, label: "Month 5", range: "Dec 14 – Jan 10", weeks: [
    { w: 17, dates: "Dec 14–20", tasks: [
      "NeetCode 150 (Python): Greedy — 8 problems (cumulative 129/150)",
      "System Design Primer OOD: Design a parking lot + an elevator system",
      "Book a mock interview 2 weeks out" ]},
    { w: 18, dates: "Dec 21–27", tasks: [
      "NeetCode 150 (Python): Intervals — 6 problems (cumulative 135/150)",
      "System Design Primer OOD: Design an LRU cache + a vending/ATM machine",
      "Tighten STAR stories from Month 1" ]},
    { w: 19, dates: "Dec 28–Jan 3", tasks: [
      "NeetCode 150 (Python): Math & Geometry — 8 problems (cumulative 143/150)",
      "Primer review: redo one earlier case study from memory, cold",
      "Do the booked mock interview, fix the gaps it revealed" ]},
    { w: 20, dates: "Jan 4–10", tasks: [
      "NeetCode 150 (Python): Bit Manipulation — 7 problems — 150/150 COMPLETE",
      "Primer final review: 2 random questions, cold, 45 min each",
      "Book second mock interview" ]},
  ]},
  { m: 6, label: "Month 6", range: "Jan 11 – Feb 7", weeks: [
    { w: 21, dates: "Jan 11–17", tasks: [
      "Message 5 referral contacts on LinkedIn",
      "Apply to fresh postings within 48hrs of listing (target 15-20 this week)" ]},
    { w: 22, dates: "Jan 18–24", tasks: [
      "Message 5 more referral contacts",
      "Keep NeetCode warm — 2 timed mediums this week" ]},
    { w: 23, dates: "Jan 25–31", tasks: [
      "Interview cycles — log every gap the same day, fix within 48hrs",
      "Second mock interview" ]},
    { w: 24, dates: "Feb 1–7", tasks: [
      "Keep applying + interviewing",
      "Negotiate using portfolio project + architecture depth as anchors" ]},
  ]},
];

let dailyLog = {};
let taskState = {};
let activeMonth = 1;

function dateStr(d) { return d.toISOString().slice(0,10); }
function todayStr() { return dateStr(new Date()); }

async function loadData() {
  try {
    const log = localStorage.getItem('daily-log');
    dailyLog = log ? JSON.parse(log) : {};
  } catch(e) { dailyLog = {}; }
  try {
    const ts = localStorage.getItem('task-state');
    taskState = ts ? JSON.parse(ts) : {};
  } catch(e) { taskState = {}; }
}

async function saveDailyLog() {
  try { localStorage.setItem('daily-log', JSON.stringify(dailyLog)); }
  catch(e) { console.error('save failed', e); }
}
async function saveTaskState() {
  try { localStorage.setItem('task-state', JSON.stringify(taskState)); }
  catch(e) { console.error('save failed', e); }
}

function computeStreak() {
  let streak = 0;
  let d = new Date();
  if (!dailyLog[todayStr()]) { d.setDate(d.getDate() - 1); }
  while (dailyLog[dateStr(d)]) {
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

function computeBestStreak() {
  const dates = Object.keys(dailyLog).filter(k => dailyLog[k]).sort();
  if (!dates.length) return 0;
  let best = 1, cur = 1;
  for (let i = 1; i < dates.length; i++) {
    const prev = new Date(dates[i-1]);
    const currD = new Date(dates[i]);
    const diff = (currD - prev) / 86400000;
    if (diff === 1) { cur++; best = Math.max(best, cur); }
    else { cur = 1; }
  }
  return best;
}

function renderStreak() {
  document.getElementById('streakNum').textContent = computeStreak();
  document.getElementById('bestStreak').innerHTML = computeBestStreak() + ' days';
  const btn = document.getElementById('checkinBtn');
  if (dailyLog[todayStr()]) {
    btn.textContent = '✓ Done for today';
    btn.classList.add('done');
  } else {
    btn.textContent = 'Mark today done';
    btn.classList.remove('done');
  }
}

function renderStrand() {
  const strand = document.getElementById('strand');
  strand.innerHTML = '';
  const days = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(dateStr(d));
  }
  days.forEach(ds => {
    const lant = document.createElement('div');
    lant.className = 'lantern' + (dailyLog[ds] ? ' lit' : '');
    lant.title = ds;
    strand.appendChild(lant);
  });
}

function taskId(m, w, i) { return `m${m}w${w}t${i}`; }

function computeOverall() {
  let total = 0, done = 0;
  PLAN.forEach(month => month.weeks.forEach(week => week.tasks.forEach((t, i) => {
    total++;
    if (taskState[taskId(month.m, week.w, i)]) done++;
  })));
  return { total, done, pct: total ? Math.round(done/total*100) : 0 };
}

function computeMonthProgress(m) {
  const month = PLAN.find(x => x.m === m);
  let total = 0, done = 0;
  month.weeks.forEach(week => week.tasks.forEach((t, i) => {
    total++;
    if (taskState[taskId(m, week.w, i)]) done++;
  }));
  return { total, done };
}

function renderOverall() {
  const { pct } = computeOverall();
  document.getElementById('overallFill').style.width = pct + '%';
  document.getElementById('overallPct').textContent = pct + '%';
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  PLAN.forEach(month => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (month.m === activeMonth ? ' active' : '');
    btn.textContent = month.label;
    btn.onclick = () => { activeMonth = month.m; renderAll(); };
    tabs.appendChild(btn);
  });
}

function renderWeeks() {
  const month = PLAN.find(x => x.m === activeMonth);
  const { done, total } = computeMonthProgress(activeMonth);
  document.getElementById('monthProgress').textContent = `${month.range}  ·  ${done}/${total} tasks done`;

  const container = document.getElementById('weeksContainer');
  container.className = '';
  container.innerHTML = '';

  month.weeks.forEach(week => {
    const wDone = week.tasks.filter((t,i) => taskState[taskId(month.m, week.w, i)]).length;
    const card = document.createElement('div');
    card.className = 'week';

    const head = document.createElement('div');
    head.className = 'week-head';
    head.innerHTML = `<div><div class="week-title">Week ${week.w}</div><div class="week-dates">${week.dates}</div></div><div class="week-badge">${wDone}/${week.tasks.length}</div>`;

    const body = document.createElement('div');
    body.className = 'week-body' + (wDone < week.tasks.length ? '' : '');

    week.tasks.forEach((t, i) => {
      const id = taskId(month.m, week.w, i);
      const row = document.createElement('div');
      row.className = 'task' + (taskState[id] ? ' done' : '');
      row.innerHTML = `<div class="check">${taskState[id] ? '✓' : ''}</div><div class="task-text">${t}</div>`;
      row.onclick = () => {
        taskState[id] = !taskState[id];
        saveTaskState();
        renderWeeks();
        renderOverall();
      };
      body.appendChild(row);
    });

    head.onclick = () => { body.classList.toggle('open'); };
    card.appendChild(head);
    card.appendChild(body);
    container.appendChild(card);
  });

  // open first week with unfinished tasks by default
  const firstOpen = container.querySelector('.week-body');
  if (firstOpen) firstOpen.classList.add('open');
}

function renderAll() {
  renderTabs();
  renderWeeks();
  renderOverall();
  renderStreak();
  renderStrand();
}

document.getElementById('checkinBtn').onclick = () => {
  if (dailyLog[todayStr()]) return;
  dailyLog[todayStr()] = true;
  saveDailyLog();
  renderStreak();
  renderStrand();
};

document.getElementById('resetLink').onclick = async () => {
  if (!confirm('Reset all progress? This cannot be undone.')) return;
  dailyLog = {};
  taskState = {};
  await saveDailyLog();
  await saveTaskState();
  renderAll();
};

(async function init() {
  await loadData();
  renderAll();
})();
</script>
</body>
</html>
